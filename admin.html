<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - لوحة الإدارة العامة</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">⚙️</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>لوحة الإدارة العامة والتحكم</p>
            </div>
        </div>
    </header>

    <main>
        <div class="admin-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>إدارة الصلاحيات والمحطات الحقيقية</h2>
            <p>مرحباً بك، من هنا يتم اعتماد أو رفض المحطات والموزعين المتقدمين للنظام.</p>

            <h3 style="font-size: 1.1rem; margin: 1.5rem 0 1rem 0; border-bottom: 2px solid #E2E8F0; padding-bottom: 0.5rem;">طلبات الاعتماد المعلقة:</h3>

            <div id="pendingStationsList">
                <!-- سيتم تعبئة الطلبات ديناميكياً هنا -->
            </div>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>

    <script>
        // تحميل الطلبات عند فتح الصفحة
        function loadPendingStations() {
            const container = document.getElementById('pendingStationsList');
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];

            if (stations.length === 0) {
                container.innerHTML = '<p style="color: #64748B; text-align: center; padding: 1rem;">لا توجد طلبات اعتماد معلقة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            stations.forEach((station, index) => {
                if (station.status === 'pending') {
                    container.innerHTML += `
                        <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 1rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <div>
                                <h4 style="font-size: 1rem; color: #1E293B;">${station.name}</h4>
                                <p style="font-size: 0.85rem; color: #64748B;">المنطقة: ${station.region} | النوع: ${station.type}</p>
                            </div>
                            <div style="display: flex; gap: 0.5rem;">
                                <button onclick="approveStation(${index})" style="background-color: #D1FAE5; color: #059669; border: 1px solid #10B981; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer;">قبول واعتماد</button>
                                <button onclick="rejectStation(${index})" style="background-color: #FEE2E2; color: #DC2626; border: 1px solid #EF4444; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer;">رفض</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function approveStation(index) {
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            stations[index].status = 'approved';
            localStorage.setItem('stationsRequests', JSON.stringify(stations));
            alert('تم اعتماد المحطة بنجاح وأصبحت مفعلة في النظام!');
            loadPendingStations();
        }

        function rejectStation(index) {
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            stations.splice(index, 1);
            localStorage.setItem('stationsRequests', JSON.stringify(stations));
            alert('تم رفض وحذف الطلب.');
            loadPendingStations();
        }

        window.onload = loadPendingStations;
    </script>
</body>
</html>
