<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - لوحة الإدارة العامة</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- إعدادات وتفعيل الـ PWA -->
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">⚙️</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>لوحة الإدارة العامة والتحكم</p>
            </div>
        </div>
    </header>

    <main>
        <div class="admin-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>إدارة الصلاحيات والمحطات</h2>
            <p>مرحباً بك، يمكنك من هنا متابعة طلبات اعتماد المحطات والموزعين.</p>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 1rem; border-radius: 12px; text-align: center;">
                    <h3 style="color: #059669; font-size: 1.4rem;">24</h3>
                    <p style="font-size: 0.8rem; color: #64748B;">محطة معتمدة</p>
                </div>
                <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 1rem; border-radius: 12px; text-align: center;">
                    <h3 style="color: #059669; font-size: 1.4rem;">5</h3>
                    <p style="font-size: 0.8rem; color: #64748B;">طلبات معلقة</p>
                </div>
            </div>

            <h3 style="font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 2px solid #E2E8F0; padding-bottom: 0.5rem;">طلبات الاعتماد الجديدة:</h3>

            <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 1rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-size: 1rem;">محطة الباسل للمحروقات</h4>
                    <p style="font-size: 0.85rem; color: #64748B;">طالب اعتماد (محطة)</p>
                </div>
                <div>
                    <button type="button" onclick="alert('تمت الموافقة بنجاح')" style="background-color: #D1FAE5; color: #059669; border: 1px solid #10B981; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer;">قبول</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>
</body>
</html>
