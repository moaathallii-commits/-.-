<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - لوحة الإدارة السحابية</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">⚙️</div>
            <div class="logo-text">
                <h1>الإدارة السحابية</h1>
                <p>التحكم الشامل بالصلاحيات</p>
            </div>
        </div>
    </header>

    <main style="padding: 1.5rem; max-width: 600px; margin: auto;">
        <div class="admin-container">
            <a href="index.html" class="back-link" style="color: #0284C7; text-decoration: none; font-weight: 600;">← العودة للرئيسية</a>
            <h2 style="margin-top: 1rem; color: #1E293B;">إدارة طلبات ومحطات السحابة</h2>
            <div id="adminCloudList" style="margin-top: 1.5rem;">
                <p style="text-align: center; color: #64748B;">جاري جلب الطلبات من السحابة...</p>
            </div>
        </div>
    </main>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadAdminCloud() {
            const container = document.getElementById('adminCloudList');
            try {
                const querySnapshot = await db.collection("stations").get();
                let html = '';
                
                querySnapshot.forEach((docSnap) => {
                    let st = docSnap.data();
                    let id = docSnap.id;
                    
                    let badgeColor = st.status === 'approved' ? '#D1FAE5' : '#FEF3C7';
                    let textColor = st.status === 'approved' ? '#059669' : '#D97706';
                    let statusText = st.status === 'approved' ? 'معتمدة' : 'معلقة';

                    html += `
                        <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                            <div>
                                <h4 style="font-size:0.95rem; color: #1E293B; margin-bottom: 0.2rem;">${st.name}</h4>
                                <p style="font-size:0.8rem; color:#64748B;">${st.region} | <span style="background:${badgeColor}; color:${textColor}; padding:0.1rem 0.4rem; border-radius:4px; font-weight: 600;">${statusText}</span></p>
                            </div>
                            <div style="display:flex; gap:0.4rem;">
                                ${st.status === 'pending' ? 
                                    `<button onclick="updateSt('${id}', 'approved')" style="background:#D1FAE5; color:#059669; border:1px solid #10B981; padding:0.3rem 0.6rem; border-radius:6px; cursor:pointer; font-weight:600;">قبول</button>` : 
                                    `<button onclick="updateSt('${id}', 'revoked')" style="background:#FEE2E2; color:#DC2626; border:1px solid #EF4444; padding:0.3rem 0.6rem; border-radius:6px; cursor:pointer; font-weight:600;">إيقاف</button>`
                                }
                            </div>
                        </div>`;
                });

                container.innerHTML = html || '<p style="text-align:center; color:#64748B;">لا توجد طلبات في السحابة.</p>';
            } catch (error) {
                container.innerHTML = '<p style="text-align:center; color:red;">خطأ في الاتصال بالسحابة.</p>';
            }
        }

        async function updateSt(id, action) {
            try {
                const docRef = db.collection("stations").doc(id);
                if (action === 'revoked') {
                    await docRef.delete();
                    alert('تم نزع الصلاحية وإزالة المحطة من السحابة!');
                } else {
                    await docRef.update({ status: 'approved' });
                    alert('تمت الموافقة واعتماد المحطة سحابياً!');
                }
                loadAdminCloud();
            } catch (error) {
                alert('حدث خطأ أثناء التحديث.');
            }
        }

        window.onload = loadAdminCloud;
    </script>
</body>
</html>
