<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - لوحة الإدارة</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">⚙️</div>
            <div class="logo-text">
                <h1>لوحة الإدارة الشاملة</h1>
                <p>تحكم كامل بصلاحيات المحطات</p>
            </div>
        </div>
    </header>

    <main>
        <div class="admin-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>إدارة المحطات المعتمدة والطلبات</h2>

            <h3 style="font-size: 1.1rem; margin: 1.5rem 0 1rem 0;">طلبات الاعتماد المعلقة:</h3>
            <div id="pendingList"></div>

            <h3 style="font-size: 1.1rem; margin: 2rem 0 1rem 0;">المحطات المعتمدة (تحكم كامل):</h3>
            <div id="approvedList"></div>
        </div>
    </main>

    <script>
        function loadAdmin() {
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            
            // عرض الطلبات المعلقة
            let pendingHTML = '';
            // عرض المحطات المعتمدة
            let approvedHTML = '';

            stations.forEach((st, idx) => {
                if (st.status === 'pending') {
                    pendingHTML += `
                        <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                            <div>
                                <h4>${st.name}</h4>
                                <p style="font-size:0.8rem; color:#64748B;">${st.region}</p>
                            </div>
                            <button onclick="updateStatus(${idx}, 'approved')" style="background:#D1FAE5; color:#059669; border:1px solid #10B981; padding:0.4rem 0.8rem; border-radius:8px; font-weight:600; cursor:pointer;">قبول الاعتماد</button>
                        </div>`;
                } else if (st.status === 'approved') {
                    approvedHTML += `
                        <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                            <div>
                                <h4>${st.name}</h4>
                                <p style="font-size:0.8rem; color:#059669;">حالة الصلاحية: مفعلة ومعتمدة</p>
                            </div>
                            <button onclick="updateStatus(${idx}, 'revoked')" style="background:#FEE2E2; color:#DC2626; border:1px solid #EF4444; padding:0.4rem 0.8rem; border-radius:8px; font-weight:600; cursor:pointer;">نزع الصلاحية وإيقاف</button>
                        </div>`;
                }
            });

            document.getElementById('pendingList').innerHTML = pendingHTML || '<p style="color:#64748B;">لا توجد طلبات معلقة.</p>';
            document.getElementById('approvedList').innerHTML = approvedHTML || '<p style="color:#64748B;">لا توجد محطات معتمدة حالياً.</p>';
        }

        function updateStatus(index, action) {
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            if (action === 'revoked') {
                stations.splice(index, 1); // حذف المحطة وإلغاء صلاحيتها تماماً
                alert('تم نزع الصلاحية وإيقاف المحطة بنجاح!');
            } else {
                stations[index].status = 'approved';
                alert('تمت الموافقة واعتماد المحطة!');
            }
            localStorage.setItem('stationsRequests', JSON.stringify(stations));
            loadAdmin();
        }

        window.onload = loadAdmin;
    </script>
</body>
</html>
