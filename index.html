<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">⛽</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>تحديد توفر المحروقات والغاز في سوريا</p>
            </div>
        </div>
    </header>

    <main style="padding: 2rem 1rem; max-width: 600px; margin: auto; text-align: center;">
        <h2 style="color: #1E293B; margin-bottom: 1rem;">أهلاً بك في منصة متوفر هناا</h2>
        <p style="color: #64748B; margin-bottom: 2rem;">اختر القسم المناسب لمتابعة التوفر أو إدارة المحطات:</p>

        <button id="installBtn" style="display: none; background: #8B5CF6; color: white; padding: 1rem; border-radius: 12px; border: none; width: 100%; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            📲 تثبيت التطبيق على الشاشة الرئيسية
        </button>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <a href="consumer.html" style="background: #10B981; color: white; padding: 1rem; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem;">
                🔍 البحث عن المواد (بنزين، مازوت، غاز)
            </a>
            <a href="station.html" style="background: #0284C7; color: white; padding: 1rem; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem;">
                ⛽ بوابة المحطات والموزعين (تسجيل وتحديث)
            </a>
            <a href="admin.html" style="background: #334155; color: white; padding: 1rem; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem;">
                ⚙️ لوحة الإدارة العامة (الاعتمادات)
            </a>
        </div>
    </main>

    <footer style="text-align: center; padding: 1.5rem; color: #64748B; font-size: 0.85rem;">
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
