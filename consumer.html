<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - البحث عن المحروقات</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">✓</div>
            <div class="logo-text">
                <h1>البحث عن المواد</h1>
                <p>تحديد الموقع الجغرافي GPS</p>
            </div>
        </div>
    </header>

    <main>
        <div class="search-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>ابحث عن المواد المتوفرة قربك</h2>
            
            <!-- زر الـ GPS الواضح -->
            <button type="button" onclick="getGPSLocation()" class="btn-primary" style="background-color: #0284C7; margin: 1rem 0;">
                📍 اضغط لتحديد موقعي الحالي (GPS)
            </button>
            <p id="gpsStatus" style="font-size: 0.85rem; color: #64748B; text-align: center; margin-bottom: 1rem;"></p>

            <div id="stationsResults"></div>
        </div>
    </main>

    <script>
        function getGPSLocation() {
            const status = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                status.textContent = 'متصفحك لا يدعم خاصية تحديد الموقع.';
                return;
            }
            status.textContent = 'جاري تفعيل الـ GPS وتحديد موقعك...';
            navigator.geolocation.getCurrentPosition((pos) => {
                status.textContent = `تم تحديد موقعك بدقة (خط العرض: ${pos.coords.latitude.toFixed(2)}, خط الطول: ${pos.coords.longitude.toFixed(2)})`;
                renderStations();
            }, () => {
                status.textContent = 'تعذر الوصول لموقعك. يرجى السماح للمتصفح بالصلاحية.';
                renderStations();
            });
        }

        function renderStations() {
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            let stock = JSON.parse(localStorage.getItem('stationStock')) || { material: 'بنزين / مازوت', quantity: 'متوفر', price: 'حسب السعر الرسمي' };
            let approved = stations.filter(s => s.status === 'approved');
            let container = document.getElementById('stationsResults');

            if (approved.length === 0) {
                container.innerHTML = '<p style="color:#64748B; text-align:center;">لا توجد محطات معتمدة متاحة حالياً.</p>';
                return;
            }

            let html = '<h3 style="font-size:1.1rem; margin-bottom:1rem;">المحطات المتاحة حالياً:</h3>';
            approved.forEach(st => {
                html += `
                    <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:1rem; border-radius:12px; margin-bottom:1rem;">
                        <h4>${st.name}</h4>
                        <p style="font-size:0.85rem; color:#64748B;">المنطقة: ${st.region}</p>
                        <div style="background:#E2E8F0; padding:0.4rem; border-radius:6px; font-size:0.8rem; margin:0.5rem 0;">
                            المادة: ${stock.material} | الكمية: ${stock.quantity} | السعر: ${stock.price}
                        </div>
                        <a href="https://wa.me/963900000000?text=مرحباً، أود الاستفسار عن توفر المواد في ${st.name}" target="_blank" style="display:block; text-align:center; background:#25D366; color:white; padding:0.5rem; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;">
                            💬 طلب عبر واتساب
                        </a>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.onload = renderStations;
    </script>
</body>
</html>
