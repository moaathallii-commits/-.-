<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - البحث عن المحروقات والغاز</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">✓</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>البحث عن المواد المتوفرة</p>
            </div>
        </div>
    </header>

    <main>
        <div class="search-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>ابحث عن المواد المتوفرة قربك</h2>
            <p>النتائج أدناه تعتمد فقط على المحطات والموزعين المعتمدين رسمياً من الإدارة.</p>

            <div id="approvedStationsList" style="margin-top: 1.5rem;">
                <!-- سيتم عرض المحطات المعتمدة هنا تلقائياً -->
            </div>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>

    <script>
        function loadApprovedStations() {
            const container = document.getElementById('approvedStationsList');
            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            
            const approved = stations.filter(s => s.status === 'approved');

            if (approved.length === 0) {
                container.innerHTML = '<p style="color: #64748B; text-align: center; padding: 1rem;">لا توجد محطات معتمدة أو متوفرة حالياً في النظام.</p>';
                return;
            }

            container.innerHTML = '<h3 style="font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 2px solid #E2E8F0; padding-bottom: 0.5rem;">المحطات والموزعون المعتمدون:</h3>';
            
            approved.forEach(station => {
                container.innerHTML += `
                    <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 1rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div>
                            <h4 style="color: #1E293B; font-size: 1rem;">${station.name}</h4>
                            <p style="font-size: 0.85rem; color: #64748B;">المنطقة: ${station.region} (${station.type})</p>
                        </div>
                        <span style="background-color: #D1FAE5; color: #059669; padding: 0.25rem 0.75rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600;">معتمد ومتاح</span>
                    </div>
                `;
            });
        }

        window.onload = loadApprovedStations;
    </script>
</body>
</html>
