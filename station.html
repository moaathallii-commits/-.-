<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - بوابة المحطات والموزعين</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">⛽</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>بوابة تسجيل وإدارة المحطات</p>
            </div>
        </div>
    </header>

    <main>
        <div class="station-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>تسجيل محطة أو موزع معتمد</h2>
            <p>أدخل بيانات محطتك أو مؤسستك ليتم مراجعتها واعتمادها من قبل الإدارة العامة.</p>

            <form id="stationForm" onsubmit="submitStationRequest(event)">
                <div class="form-group">
                    <label for="stationName">اسم المحطة أو الموزع:</label>
                    <input type="text" id="stationName" class="form-control" placeholder="مثال: محطة الأمان للمحروقات" required>
                </div>

                <div class="form-group">
                    <label for="stationRegion">المنطقة / القرية:</label>
                    <input type="text" id="stationRegion" class="form-control" placeholder="مثال: قرية العوينة - الشارع الرئيسي" required>
                </div>

                <div class="form-group">
                    <label for="stationType">التصنيف:</label>
                    <select id="stationType" class="form-control" required>
                        <option value="محطة وقود">محطة وقود</option>
                        <option value="موزع غاز">موزع غاز معتمد</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">إرسال طلب الاعتماد للإدارة</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>

    <script>
        function submitStationRequest(event) {
            event.preventDefault();
            const name = document.getElementById('stationName').value;
            const region = document.getElementById('stationRegion').value;
            const type = document.getElementById('stationType').value;

            let stations = JSON.parse(localStorage.getItem('stationsRequests')) || [];
            stations.push({ name, region, type, status: 'pending' });
            localStorage.setItem('stationsRequests', JSON.stringify(stations));

            alert('تم إرسال طلبك بنجاح إلى الإدارة العامة بانتظار الاعتماد!');
            document.getElementById('stationForm').reset();
        }
    </script>
</body>
</html>
