<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - بوابة المحطات</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">⛽</div>
            <div class="logo-text">
                <h1>بوابة المحطات</h1>
                <p>إرسال الطلبات للسحابة</p>
            </div>
        </div>
    </header>

    <main>
        <div class="station-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>تسجيل محطة أو تحديث بياناتها</h2>

            <form id="cloudStationForm">
                <div class="form-group">
                    <label>اسم المحطة أو الموزع:</label>
                    <input type="text" id="stName" class="form-control" placeholder="مثال: محطة الأمان" required>
                </div>
                <div class="form-group">
                    <label>المنطقة / القرية:</label>
                    <input type="text" id="stRegion" class="form-control" placeholder="مثال: العوينة" required>
                </div>
                <div class="form-group">
                    <label>التصنيف والمادة:</label>
                    <select id="stType" class="form-control">
                        <option value="محطة وقود">محطة وقود (بنزين/مازوت)</option>
                        <option value="موزع غاز">موزع غاز منزلي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الكمية المتوفرة:</label>
                    <input type="text" id="stQty" class="form-control" placeholder="مثال: 500 ليتر / 20 جرة" required>
                </div>
                <div class="form-group">
                    <label>السعر:</label>
                    <input type="text" id="stPrice" class="form-control" placeholder="السعر الحالي..." required>
                </div>
                <button type="submit" class="btn-primary">إرسال الطلب للإدارة سحابياً</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { db, collection, addDoc } from "./firebase-config.js";

        document.getElementById('cloudStationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('stName').value;
            const region = document.getElementById('stRegion').value;
            const type = document.getElementById('stType').value;
            const quantity = document.getElementById('stQty').value;
            const price = document.getElementById('stPrice').value;

            try {
                await addDoc(collection(db, "stations"), {
                    name, region, type, quantity, price, status: 'pending', createdAt: new Date().toISOString()
                });
                alert('تم إرسال طلب الاعتماد بنجاح إلى سحابة الفايربيس!');
                document.getElementById('cloudStationForm').reset();
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال. تأكد من إعدادات قاعدة البيانات.');
            }
        });
    </script>
</body>
</html>
