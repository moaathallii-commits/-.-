<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - بوابة المحطات والموزعين</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">⛽</div>
            <div class="logo-text">
                <h1>متوفر هناا</h1>
                <p>إدارة الكميات والأسعار</p>
            </div>
        </div>
    </header>

    <main>
        <div class="station-container">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <h2>تحديث توفر المواد والكميات</h2>
            <p>قم بتحديث الحالة، الكمية المتوفرة، والأسعار ليراها المستهلكون مباشرة.</p>

            <form id="updateStockForm" onsubmit="updateStock(event)">
                <div class="form-group">
                    <label for="materialSelect">المادة:</label>
                    <select id="materialSelect" class="form-control" required>
                        <option value="بنزين">بنزين</option>
                        <option value="مازوت">مازوت</option>
                        <option value="غاز منزلي">غاز منزلي</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantityInput">الكمية المتوفرة (مثلاً: 500 ليتر / 25 جرة):</label>
                    <input type="text" id="quantityInput" class="form-control" placeholder="أدخل الكمية المتاحة..." required>
                </div>

                <div class="form-group">
                    <label for="priceInput">السعر:</label>
                    <input type="text" id="priceInput" class="form-control" placeholder="أدخل السعر..." required>
                </div>

                <button type="submit" class="btn-primary">حفظ وتحديث البيانات</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متوفر هناا</p>
    </footer>

    <script>
        function updateStock(event) {
            event.preventDefault();
            const material = document.getElementById('materialSelect').value;
            const quantity = document.getElementById('quantityInput').value;
            const price = document.getElementById('priceInput').value;

            // حفظ بيانات المخزون محلياً للمحطة
            const stockData = { material, quantity, price, updatedAt: new Date().toLocaleTimeString() };
            localStorage.setItem('stationStock', JSON.stringify(stockData));

            alert('تم تحديث الكميات والأسعار بنجاح وتوجيهها للمستودع والسيرفر!');
        }
    </script>
</body>
</html>
