<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوفر هناا - بوابة المحطات</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">⛽</div>
            <div class="logo-text">
                <h1>بوابة المحطات</h1>
                <p>إرسال الطلبات للسحابة</p>
            </div>
        </div>
    </header>

    <main style="padding: 1.5rem; max-width: 600px; margin: auto;">
        <div class="station-container">
            <a href="index.html" class="back-link" style="color: #0284C7; text-decoration: none; font-weight: 600;">← العودة للرئيسية</a>
            <h2 style="margin-top: 1rem; color: #1E293B;">تسجيل محطة أو تحديث بياناتها</h2>

            <form id="cloudStationForm" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">اسم المحطة أو الموزع:</label>
                    <input type="text" id="stName" class="form-control" placeholder="مثال: محطة الأمان" required style="width: 100%; padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 8px;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">المنطقة / القرية:</label>
                    <input type="text" id="stRegion" class="form-control" placeholder="مثال: العوينة" required style="width: 100%; padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 8px;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">التصنيف والمادة:</label>
                    <select id="stType" class="form-control" style="width: 100%; padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 8px;">
                        <option value="محطة وقود">محطة وقود (بنزين/مازوت)</option>
                        <option value="موزع غاز">موزع غاز منزلي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">الكمية المتوفرة:</label>
                    <input type="text" id="stQty" class="form-control" placeholder="مثال: 500 ليتر / 20 جرة" required style="width: 100%; padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 8px;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">السعر:</label>
                    <input type="text" id="stPrice" class="form-control" placeholder="السعر الحالي..." required style="width: 100%; padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 8px;">
                </div>
                <button type="submit" style="background: #10B981; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">إرسال الطلب للإدارة سحابياً</button>
            </form>
        </div>
    </main>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('cloudStationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('stName').value;
            const region = document.getElementById('stRegion').value;
            const type = document.getElementById('stType').value;
            const quantity = document.getElementById('stQty').value;
            const price = document.getElementById('stPrice').value;

            try {
                await db.collection("stations").add({
                    name, region, type, quantity, price, status: 'pending', createdAt: new Date().toISOString()
                });
                alert('تم إرسال طلب الاعتماد بنجاح إلى سحابة الفايربيس!');
                document.getElementById('cloudStationForm').reset();
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال: ' + error.message);
            }
        });
    </script>
</body>
</html>
